services:
  postgres:
    image: postgres:16-alpine
    container_name: skillstream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillstream
      POSTGRES_PASSWORD: skillstream
      POSTGRES_DB: skillstream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillstream"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skillstream-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # Local SMTP catcher for transactional email dev/testing. Web UI at
  # http://localhost:8025 shows every mail the API tries to send. Point the
  # API at it with EMAIL_DRIVER=smtp, SMTP_HOST=localhost, SMTP_PORT=1025.
  mailpit:
    image: axllent/mailpit:latest
    container_name: skillstream-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    volumes:
      - mailpitdata:/data
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pgdata:
  redisdata:
  mailpitdata:
