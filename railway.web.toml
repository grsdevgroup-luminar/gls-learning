# Railway config — Web service.
# Attach to a service via env var: RAILWAY_CONFIG_FILE=railway.web.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = [
  "apps/web/**",
  "packages/shared/**",
  "packages/config/**",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
  "package.json",
]

[deploy]
startCommand = "pnpm --filter @skillstream/web start -- -p ${PORT:-3001}"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
