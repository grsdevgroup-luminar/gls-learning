# Nixpacks build plan for API service.
# Wire to service via env: NIXPACKS_CONFIG_FILE=nixpacks.api.toml

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]
aptPkgs = ["ca-certificates"]

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@11.4.0 --activate",
  "pnpm install --frozen-lockfile --prefer-offline",
]

[phases.build]
cmds = [
  "pnpm --filter @skillstream/api exec prisma generate",
  "pnpm --filter @skillstream/shared build",
  "pnpm --filter @skillstream/api build",
]

[start]
cmd = "node apps/api/dist/main.js"
